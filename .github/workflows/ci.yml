name: CI

# Runs on every PR targeting develop or main, and on pushes to those branches
# when relevant files change. All jobs must pass before a PR can be merged.

on:
  push:
    branches: [develop, main]
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - '.eslintrc.json'
      - '.prettierrc.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend: ESLint + Prettier + HTML structure checks ──────────────────────
  frontend:
    name: Frontend (Lint & Format)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint JavaScript (ESLint)
        run: npm run lint

      - name: Validate HTML structure
        run: |
          for file in index.html resume.html; do
            test -f "$file" || { echo "❌ $file missing"; exit 1; }
            grep -qi "doctype html" "$file" || { echo "❌ $file missing DOCTYPE"; exit 1; }
          done
          test -f styles.css || { echo "❌ styles.css missing"; exit 1; }
          test -f script.js  || { echo "❌ script.js missing";  exit 1; }
          echo "✅ HTML validation passed"

      - name: Check for hardcoded secrets
        run: |
          if grep -rniE "(password\s*=|secret\s*=|aws_secret)" *.js *.html \
               --include="*.js" --include="*.html" \
               | grep -v "//\|placeholder\|example"; then
            echo "⚠️  Potential secrets found — please review"
          else
            echo "✅ No hardcoded secrets detected"
          fi

  # ── Backend: pytest matrix across Python 3.9 / 3.10 / 3.11 ─────────────────
  backend-test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install boto3
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage (Python 3.9 only)
        if: matrix.python-version == '3.9'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── Backend: Black + Pylint + Flake8 + mypy ──────────────────────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install linting tools
        run: pip install black pylint flake8 mypy boto3

      - name: Black formatting check
        run: |
          black --check src/ tests/ || {
            echo "❌ Run 'black src/ tests/' to fix formatting"
            exit 1
          }

      - name: Pylint
        run: pylint src/ --exit-zero

      - name: Flake8
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: mypy type check
        run: mypy src/ --ignore-missing-imports || true
