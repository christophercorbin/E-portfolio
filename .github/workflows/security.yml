name: Security

# Runs on every push to develop/main, all PRs to main, and weekly on Mondays.
# Covers: Python (Bandit), dependencies (Safety + npm audit),
# infrastructure (Checkov), secrets (TruffleHog), and code (CodeQL).

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python security: Bandit ───────────────────────────────────────────────────
  python-security:
    name: Python Security (Bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -f screen
          HIGH=$(jq '[.results[] | select(.issue_severity=="HIGH")] | length' bandit-report.json 2>/dev/null || echo 0)
          echo "High severity issues: $HIGH"
          [ "$HIGH" -gt 0 ] && echo "⚠️  Review high-severity findings above" || echo "✅ No high-severity issues"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Dependency scanning: Safety (Python) + npm audit (Node) ──────────────────
  dependency-scan:
    name: Dependency Scan (Safety + npm audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python dependency scan (Safety)
        run: |
          pip install safety boto3
          pip freeze > installed.txt
          safety check --file installed.txt --output text || true

      - name: npm install
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate

  # ── Infrastructure scanning: Checkov on SAM/CloudFormation ───────────────────
  infrastructure-scan:
    name: Infrastructure Scan (Checkov)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov -d infrastructure/ --framework cloudformation \
            --output json --output-file-path . || true
          checkov -d infrastructure/ --framework cloudformation || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-report
          path: results_json.json

  # ── Secrets scanning: TruffleHog ─────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan (TruffleHog)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for secret scanning

      - uses: trufflesecurity/trufflehog@v3.82.13
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── Static analysis: CodeQL (JS + Python) ────────────────────────────────────
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ── Summary ───────────────────────────────────────────────────────────────────
  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [python-security, dependency-scan, infrastructure-scan, secrets-scan]
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## 🔒 Security Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scan | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python (Bandit)        | ${{ needs.python-security.result }}     |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependencies           | ${{ needs.dependency-scan.result }}     |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Infrastructure         | ${{ needs.infrastructure-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secrets (TruffleHog)   | ${{ needs.secrets-scan.result }}        |" >> "$GITHUB_STEP_SUMMARY"
